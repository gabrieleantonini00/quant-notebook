<svg xmlns="http://www.w3.org/2000/svg" width="480" height="650" viewBox="0 0 480 650" role="img" aria-labelledby="title desc">
<title id="title">Instrumental variables: a random training offer</title>
<desc id="desc">A random offer changes training participation, which affects earnings. Unobserved motivation affects both participation and earnings. Validity assumes that the offer is independent of the confounder and has no direct effect on earnings.</desc>
<rect width="100%" height="100%" fill="#f6f2e9"/>
<defs><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="#182b42"/></marker><marker id="arrow-bronze" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="#86623f"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="#626d77"/></marker></defs>
<g font-family="Inter, Arial, sans-serif">
<path d="M139 137 L139 258" fill="none" stroke="#86623f" stroke-width="2.3" marker-end="url(#arrow-bronze)"/>
<path d="M139 362 L139 483" fill="none" stroke="#182b42" stroke-width="2.3" marker-end="url(#arrow-ink)"/>
<path d="M285 311 L261 311" fill="none" stroke="#626d77" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
<path d="M373 363 L373 536 L261 536" fill="none" stroke="#626d77" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
<text x="154" y="197" text-anchor="start" fill="#86623f" font-size="20">Relevance</text>
<text x="154" y="424" text-anchor="start" fill="#182b42" font-size="20">Effect</text>
<rect x="24" y="40" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#86623f" stroke-width="1.3"/>
<text x="139.0" y="79.5" text-anchor="middle" fill="#86623f" font-size="21">Random training</text>
<text x="139.0" y="106.5" text-anchor="middle" fill="#86623f" font-size="21">offer (Z)</text>
<rect x="24" y="265" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#182b42" stroke-width="1.3"/>
<text x="139.0" y="304.5" text-anchor="middle" fill="#182b42" font-size="21">Training</text>
<text x="139.0" y="331.5" text-anchor="middle" fill="#182b42" font-size="21">participation (X)</text>
<rect x="24" y="490" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#182b42" stroke-width="1.3"/>
<text x="139.0" y="543.0" text-anchor="middle" fill="#182b42" font-size="21">Earnings (Y)</text>
<rect x="290" y="265" width="166" height="92" rx="3" fill="#fbf8f1" stroke="#626d77" stroke-width="1.3"/>
<text x="373.0" y="304.5" text-anchor="middle" fill="#626d77" font-size="21">Unobserved</text>
<text x="373.0" y="331.5" text-anchor="middle" fill="#626d77" font-size="21">motivation (U)</text>
<text x="240.0" y="625" text-anchor="middle" fill="#626d77" font-size="18">Dashed arrows: unobserved confounding</text>
</g>
</svg>
