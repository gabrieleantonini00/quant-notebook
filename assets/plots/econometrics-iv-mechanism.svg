<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
<title id="title">Instrumental variables: a random training offer</title>
<desc id="desc">A random offer changes training participation, which affects earnings. Unobserved motivation affects both participation and earnings. Validity assumes that the offer is independent of the confounder and has no direct effect on earnings.</desc>
<rect width="100%" height="100%" fill="#f6f2e9"/>
<defs><marker id="arrow-ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="#182b42"/></marker><marker id="arrow-bronze" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="#86623f"/></marker><marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9" fill="#626d77"/></marker></defs>
<g font-family="Inter, Arial, sans-serif">
<path d="M260 311 L328 311" fill="none" stroke="#86623f" stroke-width="2.3" marker-end="url(#arrow-bronze)"/>
<path d="M570 311 L638 311" fill="none" stroke="#182b42" stroke-width="2.3" marker-end="url(#arrow-ink)"/>
<path d="M557 132 L466 258" fill="none" stroke="#626d77" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
<path d="M653 132 L752 258" fill="none" stroke="#626d77" stroke-width="2.3" stroke-dasharray="6 5" marker-end="url(#arrow-muted)"/>
<text x="295" y="250" text-anchor="middle" fill="#86623f" font-size="18">Relevance</text>
<text x="605" y="250" text-anchor="middle" fill="#182b42" font-size="18">Effect</text>
<rect x="25" y="265" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#86623f" stroke-width="1.3"/>
<text x="140.0" y="304.5" text-anchor="middle" fill="#86623f" font-size="22">Random training</text>
<text x="140.0" y="331.5" text-anchor="middle" fill="#86623f" font-size="22">offer (Z)</text>
<rect x="335" y="265" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#182b42" stroke-width="1.3"/>
<text x="450.0" y="304.5" text-anchor="middle" fill="#182b42" font-size="22">Training</text>
<text x="450.0" y="331.5" text-anchor="middle" fill="#182b42" font-size="22">participation (X)</text>
<rect x="645" y="265" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#182b42" stroke-width="1.3"/>
<text x="760.0" y="318.0" text-anchor="middle" fill="#182b42" font-size="22">Earnings (Y)</text>
<rect x="490" y="35" width="230" height="92" rx="3" fill="#fbf8f1" stroke="#626d77" stroke-width="1.3"/>
<text x="605.0" y="74.5" text-anchor="middle" fill="#626d77" font-size="22">Unobserved</text>
<text x="605.0" y="101.5" text-anchor="middle" fill="#626d77" font-size="22">motivation (U)</text>
<text x="450.0" y="405" text-anchor="middle" fill="#626d77" font-size="20">Dashed arrows: unobserved confounding</text>
</g>
</svg>
