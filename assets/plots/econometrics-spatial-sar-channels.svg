<svg xmlns="http://www.w3.org/2000/svg" width="600" height="365" viewBox="0 0 600 365" role="img" aria-labelledby="title desc">
<title id="title">SAR dependence channels</title>
<desc id="desc">Local covariates enter local outcomes. Outcomes interact across neighbouring locations. Other neighbouring locations are omitted.</desc>
<defs>
<marker id="local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182b42" stroke-width="1.4"/></marker>
<marker id="spatial" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#86623f" stroke-width="1.4"/></marker>
</defs>
<rect width="600" height="365" fill="#f6f2e9"/>
<g font-family="Inter, Arial, sans-serif">
<text x="110" y="30" text-anchor="middle" font-size="19" fill="#626d77">Location A</text>
<text x="490" y="30" text-anchor="middle" font-size="19" fill="#626d77">Location B</text>
<path d="M300 55 V300" stroke="#dcd6ca" stroke-width="1"/>
<path d="M146 110 L454 110" fill="none" stroke="#86623f" stroke-width="2" marker-start="url(#spatial)" marker-end="url(#spatial)"/>
<rect x="270" y="67" width="60" height="29" fill="#f6f2e9"/><text x="300" y="87" text-anchor="middle" font-size="20" fill="#86623f">ρw</text>
<path d="M110 234 L110 146" fill="none" stroke="#182b42" stroke-width="2" marker-end="url(#local)"/>
<circle cx="110" cy="110" r="30" fill="#f6f2e9" stroke="#182b42" stroke-width="1.5"/><text x="110" y="117" text-anchor="middle" font-size="25" fill="#182b42"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="65%">A</tspan></text>
<circle cx="110" cy="270" r="30" fill="#f6f2e9" stroke="#182b42" stroke-width="1.5"/><text x="110" y="277" text-anchor="middle" font-size="25" fill="#182b42"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="65%">A</tspan></text>
<text x="83" y="198" text-anchor="end" font-size="21" fill="#182b42">β<tspan baseline-shift="sub" font-size="65%">k</tspan></text>
<path d="M490 234 L490 146" fill="none" stroke="#182b42" stroke-width="2" marker-end="url(#local)"/>
<circle cx="490" cy="110" r="30" fill="#f6f2e9" stroke="#182b42" stroke-width="1.5"/><text x="490" y="117" text-anchor="middle" font-size="25" fill="#182b42"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="65%">B</tspan></text>
<circle cx="490" cy="270" r="30" fill="#f6f2e9" stroke="#182b42" stroke-width="1.5"/><text x="490" y="277" text-anchor="middle" font-size="25" fill="#182b42"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="65%">B</tspan></text>
<text x="517" y="198" text-anchor="start" font-size="21" fill="#182b42">β<tspan baseline-shift="sub" font-size="65%">k</tspan></text>
<text x="300" y="350" text-anchor="middle" font-size="18" fill="#626d77">Outcome feedback</text>
</g>
</svg>
