<svg xmlns="http://www.w3.org/2000/svg" width="560" height="445" viewBox="0 0 560 445" role="img" aria-labelledby="title desc">
<title id="title">SDM dependence channels</title>
<desc id="desc">Spillovers from local services and interaction between house prices operate together. Other neighbouring locations are omitted.</desc>
<defs>
<marker id="local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182b42" stroke-width="1.4"/></marker>
<marker id="spatial" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#86623f" stroke-width="1.4"/></marker>
</defs>
<rect width="560" height="445" fill="#f6f2e9"/>
<g font-family="Inter, Arial, sans-serif">
<text x="110" y="30" text-anchor="middle" font-size="19" fill="#626d77">Neighbourhood A</text>
<text x="450" y="30" text-anchor="middle" font-size="19" fill="#626d77">Neighbourhood B</text>
<path d="M206 120 L354 120" fill="none" stroke="#86623f" stroke-width="2" marker-start="url(#spatial)" marker-end="url(#spatial)"/>
<rect x="250" y="76" width="60" height="29" fill="#f6f2e9"/><text x="280" y="96" text-anchor="middle" font-size="20" fill="#86623f">ρw</text>
<path d="M200 300 L354 145" fill="none" stroke="#86623f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#spatial)"/>
<path d="M360 300 L206 145" fill="none" stroke="#86623f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#spatial)"/>
<rect x="208" y="172" width="60" height="29" fill="#f6f2e9"/><text x="238" y="192" text-anchor="middle" font-size="20" fill="#86623f">θ<tspan baseline-shift="sub" font-size="65%">k</tspan>w</text>
<rect x="292" y="172" width="60" height="29" fill="#f6f2e9"/><text x="322" y="192" text-anchor="middle" font-size="20" fill="#86623f">θ<tspan baseline-shift="sub" font-size="65%">k</tspan>w</text>
<path d="M110 281 L110 169" fill="none" stroke="#182b42" stroke-width="2" marker-end="url(#local)"/>
<rect x="20" y="77" width="180" height="86" rx="9" fill="#f6f2e9" stroke="#182b42" stroke-width="1.3"/><text x="110" y="109" text-anchor="middle" font-size="20" fill="#182b42">House prices</text><text x="110" y="143" text-anchor="middle" font-size="24" fill="#182b42"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="65%">A</tspan></text>
<rect x="20" y="287" width="180" height="86" rx="9" fill="#f6f2e9" stroke="#182b42" stroke-width="1.3"/><text x="110" y="319" text-anchor="middle" font-size="20" fill="#182b42">Local services</text><text x="110" y="353" text-anchor="middle" font-size="24" fill="#182b42"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="65%">A</tspan></text>
<text x="85" y="235" text-anchor="end" font-size="21" fill="#182b42">β<tspan baseline-shift="sub" font-size="65%">k</tspan></text>
<path d="M450 281 L450 169" fill="none" stroke="#182b42" stroke-width="2" marker-end="url(#local)"/>
<rect x="360" y="77" width="180" height="86" rx="9" fill="#f6f2e9" stroke="#182b42" stroke-width="1.3"/><text x="450" y="109" text-anchor="middle" font-size="20" fill="#182b42">House prices</text><text x="450" y="143" text-anchor="middle" font-size="24" fill="#182b42"><tspan font-style="italic">y</tspan><tspan baseline-shift="sub" font-size="65%">B</tspan></text>
<rect x="360" y="287" width="180" height="86" rx="9" fill="#f6f2e9" stroke="#182b42" stroke-width="1.3"/><text x="450" y="319" text-anchor="middle" font-size="20" fill="#182b42">Local services</text><text x="450" y="353" text-anchor="middle" font-size="24" fill="#182b42"><tspan font-style="italic">x</tspan><tspan baseline-shift="sub" font-size="65%">B</tspan></text>
<text x="475" y="235" text-anchor="start" font-size="21" fill="#182b42">β<tspan baseline-shift="sub" font-size="65%">k</tspan></text>
<text x="280" y="428" text-anchor="middle" font-size="18" fill="#626d77">Service spillovers + house-price feedback</text>
</g>
</svg>
