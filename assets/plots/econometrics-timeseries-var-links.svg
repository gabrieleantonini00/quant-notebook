<path d="M206 320 L354 320" fill="none" stroke="#182b42" stroke-width="2" marker-end="url(#ink)"/>
<path d="M200 160 L354 295" fill="none" stroke="#86623f" stroke-width="2" marker-end="url(#accent)"/>
<path d="M200 295 L354 160" fill="none" stroke="#86623f" stroke-width="2" marker-end="url(#accent)"/>
