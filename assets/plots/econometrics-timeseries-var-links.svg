<rect x="20.0" y="98.0" width="180" height="84" rx="9" fill="#f6f2e9" stroke="#182b42" stroke-width="1.3"/><text x="110" y="130" text-anchor="middle" font-size="19" fill="#182b42">Inflation</text><text x="110" y="163" text-anchor="middle" font-size="24" fill="#182b42"><tspan font-style="italic">π</tspan><tspan baseline-shift="sub" font-size="65%">t−1</tspan></text>
