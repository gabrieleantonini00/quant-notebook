<rect x="253" y="275" width="54" height="30" fill="#f6f2e9"/><text x="280" y="296" text-anchor="middle" font-size="22" fill="#86623f"><tspan font-style="italic">a</tspan><tspan baseline-shift="sub" font-size="65%">22</tspan></text>
