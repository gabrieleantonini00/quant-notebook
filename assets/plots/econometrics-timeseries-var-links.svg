<svg xmlns="http://www.w3.org/2000/svg" width="560" height="455" viewBox="0 0 560 455" role="img" aria-labelledby="title desc">
<title id="title">VAR(1): inflation and the policy rate</title><desc id="desc">Both past inflation and the past policy interest rate enter each current equation. Arrows run from the previous period to the current period.</desc><defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182b42" stroke-width="1.4"/></marker>
<marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#86623f" stroke-width="1.4"/></marker>
</defs>
<rect width="560" height="455" fill="#f6f2e9"/>
<g font-family="Inter, Arial, sans-serif">
<text x="110" y="30" text-anchor="middle" font-size="20" fill="#626d77">Past information</text>
<text x="450" y="30" text-anchor="middle" font-size="20" fill="#626d77">Current outcomes</text>
<text x="110" y="60" text-anchor="middle" font-size="19" fill="#626d77">t − 1</text>
<text x="450" y="60" text-anchor="middle" font-size="19" fill="#626d77">t</text>
